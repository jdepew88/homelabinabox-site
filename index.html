<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Homelab in a Box — Docker, Traefik, Cloudflare Tunnel, Portainer, and Traefik Manager starter stack for Debian/Ubuntu."
    />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="canonical" href="https://homelabinabox.app/" />
    <title>Homelab in a Box</title>
  </head>
  <body>
    <script>
      (function () {
        var k = 'hiab-theme-preset';
        var t = localStorage.getItem(k);
        var valid = t && /^(zinc|emerald|ocean|sunset|crimson)$/.test(t);
        document.documentElement.dataset.theme = valid ? t : 'ocean';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
